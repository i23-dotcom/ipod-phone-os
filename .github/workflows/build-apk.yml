name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          if [ -f app/build.gradle.kts ] || [ -f app/build.gradle ]; then
            echo "Android project already exists."
            exit 0
          fi

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          rm -rf _project
          mkdir _project

          unzip -q "$ZIP_FILE" -d _project

          PROJECT_DIR=$(dirname "$(find _project -type f -name settings.gradle.kts -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          if [ -n "${PROJECT_DIR:-}" ]; then
            cd "$PROJECT_DIR"
          fi

          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iPod-Phone-OS-debug-apk
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
